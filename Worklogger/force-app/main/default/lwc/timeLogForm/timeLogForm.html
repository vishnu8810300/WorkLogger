<template>

  <lightning-card title="Time Log Entry" icon-name="standard:timesheet_entry" >

    <div class="slds-box">

    <div class="slds-grid slds-wrap">  
      <div class="slds-col slds-size_8-of-12">
   <span></span>
 </div>
 <div class="slds-col slds-size_4-of-12">
  <div class="slds-p-around_medium">
    <lightning-input
      type="date"
      label="Date"
      value={selectedDate}
      onchange={handleDateChange}
      required
    ></lightning-input>
  </div>
 </div>
</div>
   
    
    <template for:each={entries} for:item="entry" for:index="index">
      <div key={entry.id} >

        <div class="slds-grid slds-gutters">
          <div class="slds-col">
            <c-reusable-lookup data-id="projectId-{entry.id}" entry-id={entry.id} label="Project" selected-icon-name="standard:Account" object-label="Project"
            object-api-name="Project__c" field-api-name="Name" other-field-api-name="Description__c"
            onvalueselected={handleValueSelectedOnAccount}>
        </c-reusable-lookup>
          </div>
          <div class="slds-col">
            <lightning-input
             data-id="startTime-{entry.id}"
            type="time"
            label="Start Time"
            value={entry.startTime}
            data-index={index}
            data-field="startTime"
            onchange={handleChange}
            required
          ></lightning-input>
          </div>
          <div class="slds-col">
            <lightning-input
            data-id="endTime-{entry.id}"
          type="time"
          label="End Time"
          value={entry.endTime}
          data-index={index}
          data-field="endTime"
          onchange={handleChange}
          required
        ></lightning-input>
          </div>
          <div class="slds-col">
            <lightning-input
          type="number"
          label="Spent Hours"
          value={entry.spentHours}
          disabled
        ></lightning-input>
          </div>
        </div>

     
      </div>
    </template>

    <!-- Buttons Section -->
    <div class="slds-m-around_medium slds-align_absolute-center">
      <lightning-button label="Add Entry" icon-name="utility:add" onclick={addEntry} class="slds-m-right_small"></lightning-button>
      <lightning-button label="Remove Entry" icon-name="utility:delete" onclick={removeEntry} variant="destructive"></lightning-button>
    </div>

    <div class="slds-align_absolute-center slds-m-top_medium">
      <lightning-button label="Submit All" variant="brand" onclick={handleSubmit}></lightning-button>
    </div>
  </div>
  </lightning-card>

</template>
